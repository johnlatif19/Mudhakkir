<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="مُذَكِّر — تسجيل الدخول." />
  <title>تسجيل الدخول | مُذَكِّر</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/BncbQFqR/Mudhakkir.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/login-admin.css" />
</head>
<body>

  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-header">
        <img src="https://i.postimg.cc/BncbQFqR/Mudhakkir.png" alt="شعار مُذَكِّر" class="login-logo" />
        <h1 id="login-title" class="login-title">مُذَكِّر | Mudhakkir</h1>
        <p class="login-subtitle">سجّل الدخول للوصول إلى لوحة المتابعة.</p>
      </header>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
            minlength="3"
            maxlength="64"
            aria-describedby="username-error"
          />
          <p class="field-error" id="username-error" hidden></p>
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              minlength="6"
              maxlength="128"
              aria-describedby="password-error"
            />
            <button type="button" class="password-toggle" id="password-toggle" aria-label="إظهار كلمة المرور">
              إظهار
            </button>
          </div>
          <p class="field-error" id="password-error" hidden></p>
        </div>

        <p class="form-error" id="form-error" role="alert" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          <span class="btn-label">دخول</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <footer class="login-footer">
        <a href="/" class="link-inline">العودة إلى الصفحة الرئيسية</a>
      </footer>
    </section>
  </main>

  <script src="/public/js/login-admin.js" defer></script>
</body>
</html>
