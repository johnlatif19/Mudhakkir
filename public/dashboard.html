<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="مُذَكِّر — لوحة المتابعة." />
  <title>لوحة المتابعة | مُذَكِّر</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/BncbQFqR/Mudhakkir.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public/css/dashboard.css" />
</head>
<body>

  <header class="dash-header">
    <div class="container dash-header-inner">
      <a href="/" class="brand" aria-label="مُذَكِّر - الصفحة الرئيسية">
        <img src="https://i.postimg.cc/BncbQFqR/Mudhakkir.png" alt="شعار مُذَكِّر" class="brand-logo" />
        <span class="brand-text">
          <span class="brand-ar">مُذَكِّر</span>
          <span class="brand-en">Mudhakkir</span>
        </span>
      </a>

      <nav class="dash-nav" aria-label="تنقل اللوحة">
        <a href="/chat">المحادثة</a>
        <button type="button" class="btn btn-ghost btn-sm" id="logout-btn">خروج</button>
      </nav>
    </div>
  </header>

  <main class="container dash-main">

    <section class="dash-intro">
      <h1>لوحة المتابعة</h1>
      <p class="muted">نظرة سريعة على الزيارات والصلوات المكتملة.</p>
    </section>

    <section class="stats" aria-label="الإحصائيات">
      <article class="stat-card">
        <p class="stat-label">عدد الزوار</p>
        <p class="stat-value" id="stat-total-visitors">—</p>
      </article>
      <article class="stat-card">
        <p class="stat-label">زوار اليوم</p>
        <p class="stat-value" id="stat-today-visitors">—</p>
      </article>
      <article class="stat-card">
        <p class="stat-label">زوار هذا الأسبوع</p>
        <p class="stat-value" id="stat-week-visitors">—</p>
      </article>
      <article class="stat-card">
        <p class="stat-label">صلوات مكتملة اليوم</p>
        <p class="stat-value" id="stat-completed-prayers">—</p>
      </article>
    </section>

    <section class="panel" aria-labelledby="prayers-title">
      <header class="panel-header">
        <h2 id="prayers-title">صلوات اليوم</h2>
        <span class="muted" id="prayers-date">—</span>
      </header>

      <ul class="prayer-table" id="prayer-table" aria-live="polite">
        <li class="prayer-table-row is-loading"><span>جارٍ التحميل…</span></li>
      </ul>
    </section>

    <section class="panel" aria-labelledby="visits-title">
      <header class="panel-header">
        <h2 id="visits-title">أحدث الزيارات</h2>
      </header>

      <ul class="visits-list" id="visits-list" aria-live="polite">
        <li class="is-loading">جارٍ التحميل…</li>
      </ul>
    </section>

  </main>

  <script src="/public/js/dashboard.js" defer></script>
</body>
</html>
